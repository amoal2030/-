name: Deploy AL EQFAL to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Running npm ci..."
            npm ci || npm install
          else
            echo "package-lock.json not found. Running npm install..."
            npm install
          fi

      - name: Check Drive OAuth Client ID Build Config
        env:
          HAS_DRIVE_CLIENT_ID: ${{ (vars.VITE_GOOGLE_DRIVE_CLIENT_ID != '' || secrets.VITE_GOOGLE_DRIVE_CLIENT_ID != '') && 'true' || 'false' }}
        run: |
          if [ "$HAS_DRIVE_CLIENT_ID" != "true" ]; then
            echo "::warning::VITE_GOOGLE_DRIVE_CLIENT_ID is not set in GitHub Variables or Secrets; Drive linking will be disabled in this build."
          fi

      - name: Build Application for Production
        env:
          VITE_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.VITE_GOOGLE_DRIVE_CLIENT_ID || secrets.VITE_GOOGLE_DRIVE_CLIENT_ID }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
